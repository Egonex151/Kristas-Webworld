<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kristas-Webworld</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bebas+Neue&family=Caveat:wght@600&family=Cinzel:wght@600&family=Dancing+Script:wght@600&family=Great+Vibes&family=Lobster&family=Montserrat:wght@500;700&family=Oswald:wght@500&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@600&family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
    }

    #app {
      width: 75%;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #topBar {
      position: relative;
      z-index: 1000;
      width: 100%;
      padding: 8px 6px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    #thumbnailGrid {
      display: grid;
      grid-template-columns: repeat(2, 56px);
      gap: 6px;
      background: rgba(20, 20, 20, 0.85);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #444;
      flex-shrink: 0;
    }

    .thumb {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 5px;
      border: 3px solid transparent;
      cursor: pointer;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .thumb.active {
      border-color: #ffffff;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      background: rgba(20, 20, 20, 0.85);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #444;
      max-width: 100%;
    }

    .container {
      position: relative;
      width: 100%;
      min-height: 150px;
      margin: 0;
      padding: 6px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container img {
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .container img.hidden {
      display: none;
    }

    input[type="text"],
    select {
      padding: 5px 8px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #555;
      background: #2b2b2b;
      color: #fff;
    }

    input[type="text"] {
      width: 180px;
      max-width: 100%;
    }

    input[type="color"] {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid #555;
      border-radius: 5px;
      background: #2b2b2b;
      cursor: pointer;
    }

    .slider-control {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #555;
      background: #2b2b2b;
      color: #fff;
    }

    .slider-control input[type="range"] {
      width: 85px;
      margin: 0;
      cursor: pointer;
    }

    .slider-value {
      min-width: 38px;
      text-align: right;
      font-size: 13px;
    }

    .text-box {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 6px 10px;
      background: transparent;
      border: 1px dashed transparent;
      color: #ffffff;
      font-size: 36px;
      font-family: sans-serif;
      white-space: pre;
      text-align: center;
      cursor: grab;
      user-select: none;
      touch-action: pinch-zoom;
      z-index: 10;
      line-height: 1.1;
    }

    .text-box svg {
      display: block;
      pointer-events: none;
      overflow: visible;
    }

    .text-box:active {
      cursor: grabbing;
    }

    .text-box.selected {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.25);
    }

    #measureSvg {
      position: fixed;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topBar">
      <div id="thumbnailGrid" aria-label="Image Selection"></div>

      <div id="controls">
        <input type="text" id="textInput" placeholder="Enter text...">
        <select id="fontSelect" title="Font Style">
          <option value="sans-serif">Sans-Serif</option>
          <option value="serif">Serif</option>
          <option value="monospace">Monospace</option>
          <option value="cursive">Cursive</option>
          <option value="fantasy">Fantasy</option>
          <option value="Arial, Helvetica, sans-serif">Arial</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
          <option value="Verdana, Geneva, sans-serif">Verdana</option>
          <option value="Impact, Charcoal, sans-serif">Impact</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Times New Roman', Times, serif">Times New Roman</option>
          <option value="'Courier New', Courier, monospace">Courier New</option>
          <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
          <option value="'Roboto', sans-serif">Roboto</option>
          <option value="'Montserrat', sans-serif">Montserrat</option>
          <option value="'Oswald', sans-serif">Oswald</option>
          <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
          <option value="'Playfair Display', serif">Playfair Display</option>
          <option value="'Cinzel', serif">Cinzel</option>
          <option value="'Abril Fatface', serif">Abril Fatface</option>
          <option value="'Lobster', cursive">Lobster</option>
          <option value="'Pacifico', cursive">Pacifico</option>
          <option value="'Dancing Script', cursive">Dancing Script</option>
          <option value="'Great Vibes', cursive">Great Vibes</option>
          <option value="'Caveat', cursive">Caveat</option>
          <option value="'Permanent Marker', cursive">Permanent Marker</option>
          <option value="'Press Start 2P', monospace">Press Start 2P</option>
        </select>
        <label class="slider-control" title="Font Size (px)">
          Size
          <input type="range" id="sizeInput" min="8" max="200" step="2" value="36">
          <span id="sizeValue" class="slider-value">36px</span>
        </label>
        <select id="spacingSelect" title="Text Spacing">
          <option value="-0.06em">Space: 0.5x</option>
          <option value="0em" selected>Space: 1.0x</option>
          <option value="0.18em">Space: 1.5x</option>
          <option value="0.36em">Space: 2.0x</option>
        </select>
        <label class="slider-control" title="Text Curve (0% flat to 100% subtle arch)">
          Curve
          <input type="range" id="curveSlider" min="0" max="100" value="0">
          <span id="curveValue" class="slider-value">0%</span>
        </label>
        <input type="color" id="colorPicker" value="#ffffff" title="Text Color">
      </div>
    </div>

    <div class="container" id="canvasContainer">
      <img id="displayImage" src="" alt="" class="hidden">
    </div>
  </div>

  <svg id="measureSvg" width="0" height="0">
    <text id="measureText" style="white-space: pre;"></text>
  </svg>

  <script>
    const IMAGE_SCALE = 0.1; // 10% of original image dimensions
    const MAX_CURVE_RADIANS = Math.PI * 0.25; // 100% slider = 25% of previous 180-deg curve (45 deg)
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const XLINK_NS = 'http://www.w3.org/1999/xlink';

    const imageList = [
      'Rock 1.jpg',
      'Rock 2.jpg'
    ];

    const thumbnailGrid = document.getElementById('thumbnailGrid');
    const container = document.getElementById('canvasContainer');
    const displayImage = document.getElementById('displayImage');
    const input = document.getElementById('textInput');
    const fontSelect = document.getElementById('fontSelect');
    const sizeInput = document.getElementById('sizeInput');
    const sizeValue = document.getElementById('sizeValue');
    const spacingSelect = document.getElementById('spacingSelect');
    const curveSlider = document.getElementById('curveSlider');
    const curveValue = document.getElementById('curveValue');
    const colorPicker = document.getElementById('colorPicker');
    const measureText = document.getElementById('measureText');

    let textBox = null;

    function applyImageScale() {
      if (!displayImage.naturalWidth || !displayImage.naturalHeight) return;
      const scaledWidth = Math.max(1, Math.round(displayImage.naturalWidth * IMAGE_SCALE));
      const scaledHeight = Math.max(1, Math.round(displayImage.naturalHeight * IMAGE_SCALE));
      displayImage.style.maxWidth = `min(100%, ${scaledWidth}px)`;
      displayImage.style.maxHeight = `${scaledHeight}px`;
    }

    displayImage.addEventListener('load', applyImageScale);

    function selectImage(src, thumbEl) {
      displayImage.src = src;
      displayImage.classList.remove('hidden');
      if (displayImage.complete && displayImage.naturalWidth) {
        applyImageScale();
      }
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
      if (thumbEl) thumbEl.classList.add('active');
    }

    imageList.forEach(src => {
      const thumb = document.createElement('img');
      thumb.src = src;
      thumb.alt = src;
      thumb.className = 'thumb';
      thumb.addEventListener('click', () => selectImage(src, thumb));
      thumbnailGrid.appendChild(thumb);
    });

    function ensureTextBox() {
      if (textBox) return textBox;

      const box = document.createElement('div');
      box.className = 'text-box selected';
      container.appendChild(box);
      makeDraggable(box);
      textBox = box;
      return textBox;
    }

    function measureTextWidth(text, fontFamily, fontSize, letterSpacing) {
      measureText.style.fontFamily = fontFamily;
      measureText.style.fontSize = fontSize + 'px';
      measureText.style.letterSpacing = letterSpacing;
      measureText.textContent = text;
      const len = measureText.getComputedTextLength();
      return len > 0 ? len : fontSize;
    }

    function buildCurvedSvg(text, fontFamily, fontSize, letterSpacing, color, curvePercent) {
      const textWidth = measureTextWidth(text, fontFamily, fontSize, letterSpacing);
      const theta = (curvePercent / 100) * MAX_CURVE_RADIANS;
      const minRadius = fontSize * 0.75;
      const radius = Math.max(textWidth / theta, minRadius);

      const actualAlpha = Math.min(Math.PI, textWidth / radius);
      const half = actualAlpha / 2;

      const padTop = fontSize * 1.25;
      const padBottom = fontSize * 0.8;
      const halfW = (radius + fontSize * 1.15) * Math.sin(half) + fontSize * 0.6;

      const svgWidth = Math.ceil(halfW * 2);
      const svgHeight = Math.ceil(radius * (1 - Math.cos(half)) + padTop + padBottom);
      const cx = svgWidth / 2;
      const cy = radius + padTop;

      const extraArc = Math.min(0.25, Math.max((fontSize * 4) / radius, actualAlpha * 0.2));
      const pathAlpha = Math.min(Math.PI * 1.25, actualAlpha + extraArc);
      const pathHalf = pathAlpha / 2;
      const x1 = cx - radius * Math.sin(pathHalf);
      const y1 = cy - radius * Math.cos(pathHalf);
      const x2 = cx + radius * Math.sin(pathHalf);
      const y2 = cy - radius * Math.cos(pathHalf);
      const largeArc = pathAlpha > Math.PI ? 1 : 0;

      const pathData = `M ${x1.toFixed(3)} ${y1.toFixed(3)} A ${radius.toFixed(3)} ${radius.toFixed(3)} 0 ${largeArc} 1 ${x2.toFixed(3)} ${y2.toFixed(3)}`;

      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('width', svgWidth);
      svg.setAttribute('height', svgHeight);
      svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);

      const defs = document.createElementNS(SVG_NS, 'defs');
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('id', 'textArcPath');
      path.setAttribute('d', pathData);
      defs.appendChild(path);
      svg.appendChild(defs);

      const textEl = document.createElementNS(SVG_NS, 'text');
      textEl.setAttribute('fill', color);
      textEl.setAttribute('text-anchor', 'middle');
      textEl.style.fontFamily = fontFamily;
      textEl.style.fontSize = fontSize + 'px';
      textEl.style.letterSpacing = letterSpacing;
      textEl.style.whiteSpace = 'pre';

      const textPath = document.createElementNS(SVG_NS, 'textPath');
      textPath.setAttribute('href', '#textArcPath');
      textPath.setAttributeNS(XLINK_NS, 'xlink:href', '#textArcPath');
      textPath.setAttribute('startOffset', '50%');
      textPath.textContent = text;

      textEl.appendChild(textPath);
      svg.appendChild(textEl);

      return svg;
    }

    function renderTextBox() {
      const value = input.value;
      if (value.length === 0) {
        if (textBox) {
          textBox.textContent = '';
          textBox.style.display = 'none';
        }
        return;
      }

      const box = ensureTextBox();
      box.style.display = 'block';

      const fontFamily = fontSelect.value;
      const fontSize = Math.max(8, Math.min(200, parseFloat(sizeInput.value) || 36));
      const letterSpacing = spacingSelect.value;
      const color = colorPicker.value;
      const curvePercent = parseInt(curveSlider.value, 10) || 0;

      box.style.fontFamily = fontFamily;
      box.style.fontSize = fontSize + 'px';
      box.style.letterSpacing = letterSpacing;
      box.style.color = color;

      if (curvePercent === 0) {
        box.textContent = value;
      } else {
        box.textContent = '';
        const svg = buildCurvedSvg(value, fontFamily, fontSize, letterSpacing, color, curvePercent);
        box.appendChild(svg);
      }
    }

    input.addEventListener('input', renderTextBox);
    fontSelect.addEventListener('change', renderTextBox);
    spacingSelect.addEventListener('change', renderTextBox);
    colorPicker.addEventListener('input', renderTextBox);

    sizeInput.addEventListener('input', () => {
      sizeValue.textContent = sizeInput.value + 'px';
      renderTextBox();
    });

    curveSlider.addEventListener('input', () => {
      curveValue.textContent = curveSlider.value + '%';
      renderTextBox();
    });

    if (document.fonts && document.fonts.addEventListener) {
      document.fonts.addEventListener('loadingdone', () => {
        if (input.value.length > 0) renderTextBox();
      });
    }

    container.addEventListener('pointerdown', (e) => {
      if (textBox && (e.target === container || e.target === displayImage)) {
        textBox.classList.remove('selected');
      }
    });

    function makeDraggable(el) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      function lockPixelPosition() {
        if (el.style.transform !== 'none') {
          const rect = el.getBoundingClientRect();
          const parentRect = container.getBoundingClientRect();
          el.style.left = (rect.left - parentRect.left) + 'px';
          el.style.top = (rect.top - parentRect.top) + 'px';
          el.style.transform = 'none';
        }
      }

      function startDrag(clientX, clientY) {
        el.classList.add('selected');
        lockPixelPosition();
        isDragging = true;
        startX = clientX;
        startY = clientY;
        initialLeft = el.offsetLeft;
        initialTop = el.offsetTop;
      }

      function moveDrag(clientX, clientY) {
        if (!isDragging) return;
        el.style.left = (initialLeft + (clientX - startX)) + 'px';
        el.style.top = (initialTop + (clientY - startY)) + 'px';
      }

      function endDrag() {
        isDragging = false;
      }

      el.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        startDrag(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        moveDrag(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', endDrag);

      el.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          e.stopPropagation();
          const touch = e.touches[0];
          startDrag(touch.clientX, touch.clientY);
        } else {
          endDrag();
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          e.preventDefault();
          const touch = e.touches[0];
          moveDrag(touch.clientX, touch.clientY);
        } else if (e.touches.length > 1) {
          endDrag();
        }
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
          endDrag();
        }
      });

      window.addEventListener('touchcancel', endDrag);
    }
  </script>
</body>
</html>
