<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kristas-Webworld</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bebas+Neue&family=Caveat:wght@600&family=Cinzel:wght@600&family=Dancing+Script:wght@600&family=Great+Vibes&family=Lobster&family=Montserrat:wght@500;700&family=Oswald:wght@500&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@600&family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #controls {
      position: relative;
      z-index: 1000;
      flex-shrink: 0;
      margin: 6px auto 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
      background: rgba(20, 20, 20, 0.85);
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid #444;
      width: max-content;
      max-width: calc(100vw - 12px);
    }

    .container {
      position: relative;
      width: 100vw;
      flex: 1;
      min-height: 0;
      margin: 0;
      padding: 8px 6px 6px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .container img.hidden {
      display: none;
    }

    input[type="text"],
    select,
    input[type="number"],
    button {
      padding: 3px 5px;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #2b2b2b;
      color: #fff;
    }

    input[type="text"] {
      width: 140px;
    }

    #imageSelect {
      max-width: 150px;
    }

    input[type="number"] {
      width: 50px;
    }

    input[type="color"] {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid #555;
      border-radius: 4px;
      background: #2b2b2b;
      cursor: pointer;
    }

    button {
      cursor: pointer;
      background: #3a3a3a;
    }

    button:active {
      background: #555;
    }

    .text-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 4px 8px;
      background: transparent;
      border: 1px dashed transparent;
      color: #ffffff;
      font-size: 28px;
      font-family: sans-serif;
      white-space: pre-wrap;
      text-align: center;
      cursor: grab;
      user-select: none;
      touch-action: none;
      z-index: 10;
    }

    .text-box:active {
      cursor: grabbing;
    }

    .text-box.selected {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div id="controls">
    <input type="text" id="textInput" placeholder="Enter text...">
    <select id="fontSelect" title="Font Style">
      <option value="sans-serif">Sans-Serif</option>
      <option value="serif">Serif</option>
      <option value="monospace">Monospace</option>
      <option value="cursive">Cursive</option>
      <option value="fantasy">Fantasy</option>
      <option value="Arial, Helvetica, sans-serif">Arial</option>
      <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
      <option value="Verdana, Geneva, sans-serif">Verdana</option>
      <option value="Impact, Charcoal, sans-serif">Impact</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Times New Roman', Times, serif">Times New Roman</option>
      <option value="'Courier New', Courier, monospace">Courier New</option>
      <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
      <option value="'Roboto', sans-serif">Roboto</option>
      <option value="'Montserrat', sans-serif">Montserrat</option>
      <option value="'Oswald', sans-serif">Oswald</option>
      <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
      <option value="'Playfair Display', serif">Playfair Display</option>
      <option value="'Cinzel', serif">Cinzel</option>
      <option value="'Abril Fatface', serif">Abril Fatface</option>
      <option value="'Lobster', cursive">Lobster</option>
      <option value="'Pacifico', cursive">Pacifico</option>
      <option value="'Dancing Script', cursive">Dancing Script</option>
      <option value="'Great Vibes', cursive">Great Vibes</option>
      <option value="'Caveat', cursive">Caveat</option>
      <option value="'Permanent Marker', cursive">Permanent Marker</option>
      <option value="'Press Start 2P', monospace">Press Start 2P</option>
    </select>
    <input type="number" id="sizeInput" value="28" min="8" max="200" title="Font Size (px)">
    <input type="color" id="colorPicker" value="#ffffff" title="Text Color">
    <select id="imageSelect" title="Select Image">
      <option value="">-- Select Image --</option>
    </select>
    <button id="addBtn" type="button">Add</button>
  </div>

  <div class="container" id="canvasContainer">
    <img id="displayImage" src="" alt="" class="hidden">
  </div>

  <script>
    const DEFAULT_TEXT = 'Your text will appear here';

    const imageList = [
      { label: '20261127_230626.jpg', src: '20261127_230626.jpg' },
      { label: '20261127_230650.jpg', src: '20261127_230650.jpg' }
    ];

    const container = document.getElementById('canvasContainer');
    const displayImage = document.getElementById('displayImage');
    const input = document.getElementById('textInput');
    const fontSelect = document.getElementById('fontSelect');
    const sizeInput = document.getElementById('sizeInput');
    const colorPicker = document.getElementById('colorPicker');
    const imageSelect = document.getElementById('imageSelect');
    const addBtn = document.getElementById('addBtn');

    let activeBox = null;

    function showSelectedImage(src) {
      if (src) {
        displayImage.src = src;
        displayImage.classList.remove('hidden');
      } else {
        displayImage.removeAttribute('src');
        displayImage.classList.add('hidden');
      }
    }

    imageList.forEach(img => {
      const option = document.createElement('option');
      option.value = img.src;
      option.textContent = img.label;
      imageSelect.appendChild(option);
    });

    imageSelect.addEventListener('change', () => {
      showSelectedImage(imageSelect.value);
    });

    function selectBox(box) {
      document.querySelectorAll('.text-box').forEach(b => b.classList.remove('selected'));
      activeBox = box;
      if (activeBox) {
        activeBox.classList.add('selected');
        input.value = activeBox.textContent === DEFAULT_TEXT ? '' : activeBox.textContent;
        fontSelect.value = activeBox.dataset.font || 'sans-serif';
        sizeInput.value = parseInt(activeBox.style.fontSize, 10) || 28;
        colorPicker.value = rgbToHex(activeBox.style.color || 'rgb(255, 255, 255)');
      }
    }

    function rgbToHex(rgb) {
      if (rgb.startsWith('#')) return rgb;
      const result = rgb.match(/\d+/g);
      if (!result) return '#ffffff';
      return '#' + result.slice(0, 3).map(x => parseInt(x, 10).toString(16).padStart(2, '0')).join('');
    }

    // Auto-clear default placeholder text on focus
    input.addEventListener('focus', () => {
      if (input.value === DEFAULT_TEXT) {
        input.value = '';
      }
      if (activeBox && activeBox.textContent === DEFAULT_TEXT) {
        activeBox.textContent = '';
      }
    });

    // Live-edit selected box text
    input.addEventListener('input', () => {
      if (activeBox) {
        activeBox.textContent = input.value;
      }
    });

    fontSelect.addEventListener('change', () => {
      if (activeBox) {
        activeBox.style.fontFamily = fontSelect.value;
        activeBox.dataset.font = fontSelect.value;
      }
    });

    sizeInput.addEventListener('input', () => {
      if (activeBox) activeBox.style.fontSize = sizeInput.value + 'px';
    });

    colorPicker.addEventListener('input', () => {
      if (activeBox) activeBox.style.color = colorPicker.value;
    });

    // Deselect when tapping empty container/background
    container.addEventListener('pointerdown', (e) => {
      if (e.target === container || e.target.tagName === 'IMG') {
        selectBox(null);
        input.value = '';
      }
    });

    function createTextBox(text) {
      const box = document.createElement('div');
      box.className = 'text-box';
      box.textContent = text;
      box.style.fontFamily = fontSelect.value;
      box.dataset.font = fontSelect.value;
      box.style.fontSize = sizeInput.value + 'px';
      box.style.color = colorPicker.value;

      container.appendChild(box);

      // Convert centered transform to pixel position so dragging is seamless
      const rect = box.getBoundingClientRect();
      const parentRect = container.getBoundingClientRect();
      box.style.left = (rect.left - parentRect.left) + 'px';
      box.style.top = (rect.top - parentRect.top) + 'px';
      box.style.transform = 'none';

      makeDraggableAndZoomable(box);
      selectBox(box);
    }

    addBtn.addEventListener('click', () => {
      const text = input.value.trim() || DEFAULT_TEXT;
      createTextBox(text);
    });

    function getTouchDistance(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    function makeDraggableAndZoomable(el) {
      let isDragging = false;
      let isPinching = false;
      let startX, startY, initialLeft, initialTop;
      let startDist = 0;
      let startFontSize = 28;

      function startDrag(clientX, clientY) {
        selectBox(el);
        isDragging = true;
        startX = clientX;
        startY = clientY;
        initialLeft = el.offsetLeft;
        initialTop = el.offsetTop;
        container.appendChild(el);
      }

      function moveDrag(clientX, clientY) {
        if (!isDragging) return;
        el.style.left = (initialLeft + (clientX - startX)) + 'px';
        el.style.top = (initialTop + (clientY - startY)) + 'px';
      }

      function endDrag() {
        isDragging = false;
      }

      // Mouse drag
      el.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        startDrag(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        moveDrag(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', endDrag);

      // Touch drag + pinch-to-zoom
      el.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        if (e.touches.length === 1) {
          isPinching = false;
          const touch = e.touches[0];
          startDrag(touch.clientX, touch.clientY);
        } else if (e.touches.length === 2) {
          e.preventDefault();
          isDragging = false;
          isPinching = true;
          selectBox(el);
          startDist = getTouchDistance(e.touches[0], e.touches[1]);
          startFontSize = parseFloat(el.style.fontSize) || 28;
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (isPinching && e.touches.length === 2) {
          e.preventDefault();
          const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
          if (startDist > 0) {
            const scale = currentDist / startDist;
            const newSize = Math.min(200, Math.max(8, Math.round(startFontSize * scale)));
            el.style.fontSize = newSize + 'px';
            if (activeBox === el) {
              sizeInput.value = newSize;
            }
          }
        } else if (isDragging && e.touches.length === 1) {
          e.preventDefault();
          const touch = e.touches[0];
          moveDrag(touch.clientX, touch.clientY);
        }
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          isPinching = false;
        }
        if (e.touches.length === 0) {
          endDrag();
        }
      });

      window.addEventListener('touchcancel', () => {
        isPinching = false;
        endDrag();
      });
    }

    // Load default image and centered text on startup
    window.addEventListener('DOMContentLoaded', () => {
      if (imageList.length > 0) {
        imageSelect.value = imageList[0].src;
        showSelectedImage(imageList[0].src);
      }
      createTextBox(DEFAULT_TEXT);
    });
  </script>
</body>
</html>
