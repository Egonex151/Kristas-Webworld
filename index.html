<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kristas-Webworld</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    #controls {
      position: fixed;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      align-items: center;
      background: rgba(20, 20, 20, 0.85);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #444;
      width: max-content;
      max-width: calc(100vw - 12px);
    }

    input[type="text"],
    select,
    button,
    input[type="number"] {
      padding: 6px 8px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: #fff;
    }

    input[type="text"] {
      width: 140px;
    }

    input[type="number"] {
      width: 56px;
    }

    input[type="color"] {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2b2b2b;
      cursor: pointer;
    }

    button {
      cursor: pointer;
      background: #3a3a3a;
    }

    button:active {
      background: #555;
    }

    .text-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 6px 10px;
      background: transparent;
      border: 1px dashed transparent;
      border-radius: 4px;
      color: #ffffff;
      font-size: 32px;
      font-family: sans-serif;
      white-space: pre-wrap;
      text-align: center;
      cursor: grab;
      user-select: none;
      touch-action: none;
      z-index: 10;
    }

    .text-box:active {
      cursor: grabbing;
    }

    .text-box.selected {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>

  <div id="controls">
    <input type="text" id="textInput" placeholder="Enter text...">
    <select id="fontSelect">
      <option value="sans-serif">Sans-Serif</option>
      <option value="serif">Serif</option>
      <option value="monospace">Monospace</option>
      <option value="cursive">Cursive</option>
    </select>
    <input type="number" id="sizeInput" value="32" min="8" max="200" title="Font Size (px)">
    <input type="color" id="colorPicker" value="#ffffff" title="Text Color">
    <button id="addBtn">Add</button>
  </div>

  <div class="container" id="canvasContainer">
    <img src="20261120_102519.jpg" alt="">
  </div>

  <script>
    const container = document.getElementById('canvasContainer');
    const input = document.getElementById('textInput');
    const fontSelect = document.getElementById('fontSelect');
    const sizeInput = document.getElementById('sizeInput');
    const colorPicker = document.getElementById('colorPicker');
    const addBtn = document.getElementById('addBtn');

    let activeBox = null;

    function selectBox(box) {
      document.querySelectorAll('.text-box').forEach(b => b.classList.remove('selected'));
      activeBox = box;
      if (activeBox) {
        activeBox.classList.add('selected');
        input.value = activeBox.textContent;
        fontSelect.value = activeBox.style.fontFamily || 'sans-serif';
        sizeInput.value = parseInt(activeBox.style.fontSize, 10) || 32;
        colorPicker.value = rgbToHex(activeBox.style.color || 'rgb(255, 255, 255)');
      }
    }

    function rgbToHex(rgb) {
      if (rgb.startsWith('#')) return rgb;
      const result = rgb.match(/\d+/g);
      if (!result) return '#ffffff';
      return '#' + result.slice(0, 3).map(x => parseInt(x, 10).toString(16).padStart(2, '0')).join('');
    }

    // Live-edit selected box text
    input.addEventListener('input', () => {
      if (activeBox) {
        activeBox.textContent = input.value;
      }
    });

    fontSelect.addEventListener('change', () => {
      if (activeBox) activeBox.style.fontFamily = fontSelect.value;
    });

    sizeInput.addEventListener('input', () => {
      if (activeBox && sizeInput.value) {
        activeBox.style.fontSize = sizeInput.value + 'px';
      }
    });

    colorPicker.addEventListener('input', () => {
      if (activeBox) activeBox.style.color = colorPicker.value;
    });

    // Deselect when tapping empty container/background
    container.addEventListener('pointerdown', (e) => {
      if (e.target === container || e.target.tagName === 'IMG') {
        selectBox(null);
        input.value = '';
      }
    });

    function createTextBox(text) {
      const box = document.createElement('div');
      box.className = 'text-box';
      box.textContent = text;
      box.style.fontFamily = fontSelect.value;
      box.style.fontSize = (sizeInput.value || 32) + 'px';
      box.style.color = colorPicker.value;

      container.appendChild(box);

      // Convert initial centered % position to exact px so dragging is seamless
      const rect = box.getBoundingClientRect();
      const parentRect = container.getBoundingClientRect();
      box.style.left = (rect.left - parentRect.left) + 'px';
      box.style.top = (rect.top - parentRect.top) + 'px';
      box.style.transform = 'none';

      makeDraggable(box);
      selectBox(box);
    }

    addBtn.addEventListener('click', () => {
      const text = input.value.trim() || 'Your text here';
      createTextBox(text);
    });

    function makeDraggable(el) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      function startDrag(clientX, clientY) {
        selectBox(el);
        isDragging = true;
        startX = clientX;
        startY = clientY;
        initialLeft = el.offsetLeft;
        initialTop = el.offsetTop;
      }

      function moveDrag(clientX, clientY) {
        if (!isDragging) return;
        el.style.left = (initialLeft + (clientX - startX)) + 'px';
        el.style.top = (initialTop + (clientY - startY)) + 'px';
      }

      function endDrag() {
        isDragging = false;
      }

      el.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        startDrag(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        moveDrag(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', endDrag);

      el.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        e.stopPropagation();
        const touch = e.touches[0];
        startDrag(touch.clientX, touch.clientY);
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const touch = e.touches[0];
        moveDrag(touch.clientX, touch.clientY);
      }, { passive: true });

      window.addEventListener('touchend', endDrag);
      window.addEventListener('touchcancel', endDrag);
    }

    // Create default centered text on load
    window.addEventListener('DOMContentLoaded', () => {
      createTextBox('Your text will appear here');
    });
  </script>
</body>
</html>
